spring:
  jpa:
    hibernate:
      ddl-auto: validate
    # Mantido habilitado: os recursos de IA montam o contexto de CQ percorrendo a
    # colecao LAZY QcRecord.violations (AiService.buildQcContext) fora da transacao
    # de leitura. Com open-in-view=false isso lanca LazyInitializationException e
    # derruba todas as funcoes de IA. A conexao nao fica presa durante a chamada
    # da OpenAI (o Hibernate libera apos cada lazy-load) e as respostas sao DTOs.
    open-in-view: ${JPA_OPEN_IN_VIEW:true}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    baseline-on-migrate: true

management:
  health:
    mail:
      enabled: false

app:
  auth:
    refresh-cookie:
      secure: ${AUTH_REFRESH_COOKIE_SECURE:true}
      same-site: ${AUTH_REFRESH_COOKIE_SAME_SITE:None}
